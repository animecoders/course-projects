<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <style>
    body { margin: 0; }
    .hero { position: relative; }
    .hero img { display: block; width: 100%;}
    .hero a {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.9rem 1.6rem;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font: 600 1rem/1 sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgb(0 0 0 / 25%);
    }
    .hero a:hover { background: #eee; }
  </style>
</head>
<body>
  <div class="hero">
    <img src="/banner.jpg" alt="Banner">
    <a href="https://www.youtube.com/watch?v=tAzAhDNdehs" target="_blank" rel="noopener noreferrer">Watch Trailer</a>
  </div>
</body>
</html>
